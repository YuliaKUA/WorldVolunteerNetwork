services:
    api:
        container_name: api
        image: worldvolunteernetwork.api
        build:
            context: .
            dockerfile: WorldVolunteerNetwork.API/Dockerfile
        ports:
            - 5000:5000
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://+:5000
            - ASPNETCORE_HTTP_PORTS=5000
        volumes:
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
        depends_on:
            - postgres
    postgres:
        container_name: postgres
        image: postgres:16.4@sha256:91f464e7ba0ad91a106c94cff079fb4384139291b8c0502fd36989cf2c788bbb
        restart: always
        environment:
            POSTGRES_DB: world_volunteer_network
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
        volumes:
        - ./postgres_data:/var/lib/postgresql/data/
    minio:
        container_name: minio
        image: minio/minio
        ports:
        - 9000:9000
        - 9001:9001  
        volumes:
        - minio_data:/data
        command: server --console-address ":9001" /data
        restart: always
    seq:
        image: datalust/seq:latest
        container_name: seq
        restart: always
        environment:
            - ACCEPT_EULA=Y
        ports:
            - 5341:5341
            - 8082:80
    redis:
        image: redis
        container_name: redis
        restart: always
        ports:
            - 6379:6379
        links:
            - redis-commander
    redis-commander:
        image: ghcr.io/joeferner/redis-commander:latest
        container_name: redis-commander
        restart: always
        environment:
            REDIS_HOST: redis
            REDIS_PASSWORD: redis
        ports:
             - 8081:8081
    zookeeper:
        image: confluentinc/cp-zookeeper:latest
        container_name: zookeeper
        restart: always
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - 2181:2181
    kafka:
        image: confluentinc/cp-kafka:latest
        container_name: kafka
        depends_on:
            - zookeeper
        ports:
            - 9092:9092
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092, PLAINTEXT_HOST://0.0.0.0:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092, PLAINTEXT_HOST://172.18.0.9:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        hostname: kafka
        restart: always
    kafka-ui:
        image: provectuslabs/kafka-ui
        container_name: kafka-ui
        ports:
           - 8090:8080
        restart: always
        environment:
              KAFKA_CLUSTERS_0_NAME: local
              KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
              KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
        links:
            - kafka
            - zookeeper

volumes:
    postgres-data:
    minio_data:
    redis:
    redis-config:

